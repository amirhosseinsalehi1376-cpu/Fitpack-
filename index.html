<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ویتر کافه">

<title>ویتر کافه</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:#f3f3f3;
  color:#151515;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",
  "Segoe UI",Tahoma,sans-serif;
}

header{
  background:#111;
  color:white;
  padding:18px 15px 12px;
  padding-top:calc(18px + env(safe-area-inset-top));
  position:sticky;
  top:0;
  z-index:20;
}

header h1{
  margin:0 0 13px;
  font-size:22px;
}

.tabs{
  display:flex;
  gap:7px;
}

.tab{
  border:0;
  background:#292929;
  color:#ddd;
  border-radius:10px;
  padding:9px 15px;
  font-size:14px;
}

.tab.active{
  background:white;
  color:#111;
}

main{
  max-width:720px;
  margin:auto;
  padding:14px 12px 115px;
}

.card{
  background:white;
  border:1px solid #e5e5e5;
  border-radius:16px;
  padding:14px;
  margin-bottom:12px;
  box-shadow:0 2px 10px rgba(0,0,0,.04);
}

h2{
  font-size:17px;
  margin:0 0 12px;
}

label{
  display:block;
  color:#777;
  font-size:13px;
  margin-bottom:6px;
}

input,
textarea{
  width:100%;
  border:1px solid #ddd;
  border-radius:11px;
  padding:11px;
  font:inherit;
  background:white;
}

textarea{
  min-height:75px;
  resize:vertical;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}


/* =========================
   دسته‌بندی محصولات
========================= */

.order-category{
  margin-bottom:20px;
}

.order-category-title{
  font-size:17px;
  font-weight:900;
  margin-bottom:10px;
  padding-bottom:8px;
  border-bottom:2px solid #111;
}

.product-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

.product-button{
  border:1px solid #e1e1e1;
  background:#fafafa;
  border-radius:13px;
  padding:12px 9px;
  min-height:70px;
  font-family:inherit;
  text-align:right;
  cursor:pointer;
  transition:.12s;
}

.product-button:active{
  transform:scale(.97);
  background:#eee;
}

.product-name{
  display:block;
  font-size:14px;
  font-weight:700;
  margin-bottom:6px;
}

.product-price{
  display:block;
  font-size:13px;
  color:#777;
  font-weight:600;
}


/* =========================
   سفارش انتخاب‌شده
========================= */

.selected-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.selected-title h2{
  margin:0;
}

.empty-order{
  text-align:center;
  color:#999;
  padding:15px 5px;
  font-size:13px;
}

.selected-item{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto auto;
  align-items:center;
  gap:8px;
  padding:10px 0;
  border-bottom:1px solid #eee;
}

.selected-item:last-child{
  border-bottom:0;
}

.selected-name{
  font-size:14px;
  font-weight:700;
}

.selected-price{
  font-size:12px;
  color:#888;
  margin-top:3px;
}

.qty-control{
  display:flex;
  align-items:center;
  gap:6px;
  direction:ltr;
}

.qty-btn{
  width:32px;
  height:32px;
  border:0;
  border-radius:9px;
  background:#eee;
  font-size:19px;
  font-weight:bold;
  cursor:pointer;
}

.qty-number{
  min-width:20px;
  text-align:center;
  font-size:14px;
  font-weight:bold;
}

.item-total{
  min-width:75px;
  text-align:left;
  font-size:13px;
  font-weight:bold;
}


/* =========================
   جمع کل
========================= */

.total{
  display:flex;
  justify-content:space-between;
  border-top:1px solid #ddd;
  margin-top:13px;
  padding-top:13px;
  font-size:19px;
  font-weight:800;
}


/* =========================
   پایین صفحه
========================= */
